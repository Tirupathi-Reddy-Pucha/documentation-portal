services:

  # PostgreSQL — stores document metadata and vector embeddings (via pgvector extension)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       curriculumlens
      POSTGRES_USER:     cluser
      POSTGRES_PASSWORD: clpassword
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluser -d curriculumlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j — stores the Curriculum Knowledge Graph (concepts and relationships)
  neo4j:
    image: neo4j:5.24-community
    container_name: cl-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/clpassword
    ports:
      - "7474:7474"  # Neo4j Browser (web UI for inspecting the graph)
      - "7687:7687"  # Bolt protocol (used by the Python neo4j driver)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # Optional: Run the FastAPI backend via Docker
  # Uncomment this block and set POSTGRES_HOST=postgres / NEO4J_URI=bolt://neo4j:7687 in .env
  # backend:
  #   build: .
  #   container_name: cl-backend
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     neo4j:
  #       condition: service_started
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./backend/uploads:/app/uploads

# Named volumes — data persists across container restarts
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
